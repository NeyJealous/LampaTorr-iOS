name: Publish v1.0.4 diagnostic release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.0.4.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful v1.0.4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download 35472591932 \
            --repo "$GITHUB_REPOSITORY" \
            --name "LampaTorr-LampaS-unsigned-ipa" \
            --dir release-artifact
          find release-artifact -maxdepth 2 -type f -print

      - name: Create release ZIP
        run: |
          set -euo pipefail
          cd release-artifact
          zip -9 -r ../LampaTorr-v1.0.4-CUB-diagnostics-unsigned.zip .
          cd ..
          ls -lh LampaTorr-v1.0.4-CUB-diagnostics-unsigned.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.4-diag"
          FILE="LampaTorr-v1.0.4-CUB-diagnostics-unsigned.zip"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "66bc533bb74f2d3bcbf9c5161f1d135009ebd719" \
              --title "LampaTorr v1.0.4 Diagnostic" \
              --notes "Diagnostic build based on the restored v1.0.0 runtime baseline. Adds CUB request diagnostics only; TorrServer, proxy and VLC runtime remain unchanged from the restored working baseline."
          fi
