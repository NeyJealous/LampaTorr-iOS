name: Build LampaTorr IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID (должен подходить к твоему provisioning profile в Ksign)"
        required: true
        default: "dev.lampatorr.ios"
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ inputs.bundle_id || 'dev.lampatorr.ios' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          echo "Bundle ID: $BUNDLE_ID"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Lampa + TorrServerKit
        run: bash ./scripts/prepare.sh

      - name: Build unsigned IPA
        run: bash ./scripts/build-unsigned-ipa.sh "$BUNDLE_ID"

      - name: Inspect IPA
        run: |
          set -euo pipefail
          unzip -l LampaTorr-unsigned.ipa | head -80
          test -s LampaTorr-unsigned.ipa
          echo "### LampaTorr build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle ID: `$BUNDLE_ID`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Скачай artifact **LampaTorr-unsigned-ipa**, распакуй ZIP на iPhone и подпиши файл **LampaTorr-unsigned.ipa** в Ksign." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LampaTorr-unsigned-ipa
          path: LampaTorr-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
