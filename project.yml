name: LampaTorr
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  LampaTorr:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LampaTorr
        excludes:
          - Info.plist
    dependencies:
      - framework: Vendor/TorrServerKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lampatorr.ios
        PRODUCT_NAME: LampaTorr
        INFOPLIST_FILE: LampaTorr/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: minimal
    preBuildScripts:
      - name: Verify prepared dependencies
        script: |
          set -e
          test -d "$SRCROOT/Vendor/TorrServerKit.xcframework" || { echo "error: Run ./scripts/prepare.sh first (TorrServerKit missing)"; exit 1; }
          test -f "$SRCROOT/Vendor/Lampa/index.html" || { echo "error: Run ./scripts/prepare.sh first (Lampa missing)"; exit 1; }
    postBuildScripts:
      - name: Copy bundled Lampa web app
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Lampa"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          ditto "$SRCROOT/Vendor/Lampa" "$DEST"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Lampa/index.html
    scheme:
      testTargets: []
