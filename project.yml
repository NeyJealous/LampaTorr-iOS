name: LampaTorr
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    revision: 440dc1df19d181b500ae414762671701d192bcf8

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: 0.10.0

targets:
  LampaTorr:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LampaTorr
        excludes:
          - Info.plist
          - Resources/LampaSIcon.base64
    dependencies:
      - framework: Vendor/TorrServerKit.xcframework
        embed: false
      - package: VLCKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lampatorr.ios
        PRODUCT_NAME: LampaTorr
        INFOPLIST_FILE: LampaTorr/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    preBuildScripts:
      - name: Verify prepared dependencies
        script: |
          set -e
          test -d "$SRCROOT/Vendor/TorrServerKit.xcframework" || { echo "error: Run ./scripts/prepare.sh first (TorrServerKit missing)"; exit 1; }
          test -f "$SRCROOT/LampaTorr/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" || { echo "error: LampaS app icon missing"; exit 1; }
    scheme:
      testTargets: []
